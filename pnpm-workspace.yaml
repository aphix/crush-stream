overrides:
  nf3: 0.3.17
# @kmamal/gl's install script downloads its native binary from GitHub: never at install (the Lux deploy installs dev dependencies
# too). scripts/headless-frame.mjs names the one-time fetch when the binary is missing.
allowBuilds:
  "@kmamal/gl": false
minimumReleaseAgeExclude:
  - '@napi-rs/canvas-android-arm64@1.0.12'
  - '@napi-rs/canvas-darwin-arm64@1.0.12'
  - '@napi-rs/canvas-darwin-x64@1.0.12'
  - '@napi-rs/canvas-linux-arm-gnueabihf@1.0.12'
  - '@napi-rs/canvas-linux-arm64-gnu@1.0.12'
  - '@napi-rs/canvas-linux-arm64-musl@1.0.12'
  - '@napi-rs/canvas-linux-riscv64-gnu@1.0.12'
  - '@napi-rs/canvas-linux-x64-gnu@1.0.12'
  - '@napi-rs/canvas-linux-x64-musl@1.0.12'
  - '@napi-rs/canvas-win32-arm64-msvc@1.0.12'
  - '@napi-rs/canvas-win32-x64-msvc@1.0.12'
  - '@napi-rs/canvas@1.0.12'
